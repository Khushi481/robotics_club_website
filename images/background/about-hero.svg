<svg width="1200" height="600" viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d061a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:1" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0, 243, 255, 0.05)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#grad1)" />
  <rect width="100%" height="100%" fill="url(#grid)" />
  
  <!-- Technical Shapes (Abstract Laboratory/Blueprint vibes) -->
  <circle cx="1000" cy="100" r="150" fill="none" stroke="rgba(255, 0, 204, 0.1)" stroke-width="2" />
  <circle cx="1000" cy="100" r="100" fill="none" stroke="rgba(0, 243, 255, 0.1)" stroke-width="1" stroke-dasharray="10 5" />
  
  <path d="M 50 100 L 250 100 L 300 150 L 500 150" fill="none" stroke="rgba(0, 243, 255, 0.2)" stroke-width="2" />
  <rect x="50" y="80" width="10" height="40" fill="var(--secondary-neon)" opacity="0.3" />
  
  <rect x="800" y="400" width="300" height="150" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />
  <line x1="800" y1="450" x2="1100" y2="450" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />
  <line x1="800" y1="500" x2="1100" y2="500" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />
  
  <polyline points="0,500 200,500 250,450 600,450 650,500 1200,500" fill="none" stroke="rgba(255, 0, 204, 0.1)" stroke-width="3" />
</svg>
